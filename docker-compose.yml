services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
 
  api:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports:
      - "8000:8000"
 
volumes:
  pgdata: